name: LeadFlow AI CI

on:
  push:
    paths: ["leadflow-ai/**", ".github/workflows/leadflow-ci.yml"]
  pull_request:
    paths: ["leadflow-ai/**", ".github/workflows/leadflow-ci.yml"]

permissions:
  contents: read

concurrency:
  group: leadflow-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: leadflow-ai

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow
      TEST_DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: leadflow-ai/pnpm-lock.yaml
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=leadflow psql -h localhost -U leadflow -d leadflow -c "CREATE DATABASE leadflow_test"
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Dependency audit (production)
        run: pnpm audit --prod
      - name: Production build
        run: pnpm build
      - name: Seed DEMO data
        run: pnpm db:seed
      - name: Install Playwright Chromium
        run: pnpm --filter @leadflow/web exec playwright install --with-deps chromium
      - name: E2E smoke tests
        run: |
          pnpm start > /tmp/web.log 2>&1 &
          npx --yes wait-on@8.0.4 http://localhost:3000/api/health --timeout 60000
          E2E_BASE_URL=http://localhost:3000 pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: leadflow-ai/apps/web/playwright-report
          retention-days: 7

  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: leadflow-ai/apps/collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
